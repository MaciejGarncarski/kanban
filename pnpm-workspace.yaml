packages:
  - api
  - web

allowBuilds:
  '@scarf/scarf': true
  '@swc/core': true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true

catalog:
  eslint: ^9.39.5
  nanoid: ^3.3.19
  prettier: ^3.9.7
  typescript: ^6
  zod: ^4.6.5

injectWorkspacePackages: true

minimumReleaseAge: 0

syncInjectedDepsAfterScripts:
  - build

onlyBuiltDependencies:
  - esbuild